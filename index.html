<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruleta Cultural - ONP</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="/assets/icon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- MARCADOR DE PUNTOS (Flotante en la esquina superior) -->
    <div id="marcador-puntos" class="marcador-oculto">
      👤 <span id="span-nombre-usuario"></span> | ⭐ Puntos:
      <strong id="contador-puntos">0</strong>
    </div>

    <div class="contenedor-principal">
      <img src="assets/logo.png" alt="onp-logo" class="main-logo" />
      <h1 id="titulo-principal">Ruleta cultural</h1>

      <!-- PANTALLA DE INICIO (Ingresar Nombre) -->
      <div id="panel-inicio" class="panel">
        <h2>¡Bienvenido!</h2>
        <p>Ingresa tu nombre para comenzar a jugar</p>
        <input
          type="text"
          id="input-nombre"
          placeholder="Tu nombre o el de tu equipo"
          autocomplete="off"
        />
        <button id="btn-comenzar" class="btn-accion">
          Comenzar a jugar 🚀
        </button>
      </div>

      <!-- ÁREA DE LA RULETA (Oculta al inicio) -->
      <div id="seccion-juego" class="seccion-oculta">
        <div class="ruleta-wrapper">
          <div class="flecha"></div>
          <div class="recorte-esquinas">
            <div class="ruleta" id="ruleta"></div>
          </div>
          <button id="btn-girar">¡GIRAR!</button>
        </div>
      </div>

      <!-- PANEL DE PREGUNTA -->
      <div id="panel-pregunta" class="panel oculto">
        <span id="categoria-badge"></span>
        <h2 id="pregunta-texto"></h2>
        <div id="opciones"></div>
      </div>

      <!-- PANEL DE RESULTADO -->
      <div id="panel-resultado" class="panel oculto">
        <div id="icono-resultado"></div>
        <h2 id="texto-resultado"></h2>
        <button id="btn-reintentar" class="btn-accion">
          Girar de nuevo 🔄
        </button>
      </div>
    </div>

    <!-- MODAL DE VICTORIA (5 aciertos) -->
    <div id="modal-victoria" class="modal-overlay oculto">
      <div class="modal-contenido">
        <div class="modal-icono">🏆</div>
        <h2>¡Felicidades!</h2>
        <p>
          <span id="modal-nombre-usuario"></span>, ¡ya acertaste
          <strong>5 preguntas</strong>! Eres un experto en Cultura Previsional.
        </p>
        <button id="btn-cerrar-modal" class="btn-accion">
          Seguir jugando ✨
        </button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
